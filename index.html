<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070b18">
    <meta name="description" content="元素构筑驱动的网页 Roguelite 游戏原型。">
    <title>元素幸存者 · Elemental Survivor</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="game-shell" class="game-shell">
      <canvas id="game-canvas" aria-label="元素幸存者战场"></canvas>

      <section id="hud" class="hud" aria-label="游戏状态" hidden>
        <div class="hud__top">
          <div class="health" aria-label="生命值">
            <span class="hud__label">生命</span>
            <div id="health-pips" class="health__pips"></div>
          </div>
          <div class="run-clock">
            <span id="run-time">00:00</span>
            <span id="run-level" class="run-level">等级 1</span>
          </div>
          <button id="pause-button" class="icon-button" type="button" aria-label="暂停游戏">Ⅱ</button>
        </div>
        <span id="xp-hint" class="xp-hint" aria-hidden="true"></span>
        <div id="xp-bar" class="xp-bar" role="progressbar" aria-label="经验进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="xp-fill" class="xp-bar__fill"></div>
        </div>
        <div id="weapon-strip" class="weapon-strip" aria-label="已获得能力"></div>
      </section>

      <section id="title-panel" class="panel title-panel">
        <p class="eyebrow">ELEMENTAL ROGUELITE</p>
        <h1>元素幸存者</h1>
        <p class="title-panel__lead">驾驭元素，撕开怪潮。每次升级都改变这一局。</p>
        <div class="control-hint" aria-label="操作说明">
          <span class="control-hint__desktop"><kbd>WASD</kbd> / <kbd>方向键</kbd></span>
          <span class="control-hint__touch">左下角摇杆</span>
          <strong>移动 · 自动攻击</strong>
        </div>
        <button id="start-button" class="primary-button" type="button">开始觉醒</button>
        <p class="small-print">坚持 3 分钟，试着让火与风相遇。</p>
      </section>

      <section id="upgrade-panel" class="panel upgrade-panel" aria-labelledby="upgrade-title" hidden>
        <p class="eyebrow">LEVEL UP</p>
        <h2 id="upgrade-title">选择元素蜕变</h2>
        <p id="reaction-route-rule" class="upgrade-route-rule" hidden>反应路线：本局只能激活一种。首个完成的元素反应将锁定本局路线。</p>
        <div id="upgrade-choices" class="upgrade-choices"></div>
      </section>

      <section id="pause-panel" class="panel compact-panel" aria-labelledby="pause-title" hidden>
        <p class="eyebrow">BREATH</p>
        <h2 id="pause-title">元素凝滞</h2>
        <p>战场已经暂停。</p>
        <button id="resume-button" class="primary-button" type="button">继续战斗</button>
      </section>

      <section id="game-over-panel" class="panel compact-panel" aria-labelledby="game-over-title" hidden>
        <p class="eyebrow eyebrow--danger">RUN ENDED</p>
        <h2 id="game-over-title">元素熄灭</h2>
        <div id="run-summary" class="run-summary"></div>
        <button id="restart-button" class="primary-button" type="button">再来一局</button>
      </section>

      <button id="touch-stick" class="touch-stick" type="button" aria-label="移动摇杆">
        <span class="touch-stick__knob"></span>
      </button>

      <div id="status-region" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
